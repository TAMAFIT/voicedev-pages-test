<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoiceDev Auto Publish Test</title>
  
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f8; color: #15171a; }
    main { width: min(720px, calc(100% - 32px)); padding: 48px 32px; background: white; border: 1px solid #e3e5e8; border-radius: 20px; }
    h1 { margin: 0 0 16px; font-size: clamp(28px, 6vw, 52px); }
    p { margin: 0; line-height: 1.8; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>VoiceDev Auto Publish Test</h1>
    <p>音声指示からGitHubリポジトリを自動作成し、GitHub Pagesまで全自動公開するE2Eテストです。</p>
  </main>
  
</body>
</html>
